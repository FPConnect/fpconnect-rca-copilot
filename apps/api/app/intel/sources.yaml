# FPConnect Intel/Radar — public & reliable sources
#
# Notes:
# - Add/remove feeds as needed.
# - Prefer primary/official sources for regulatory and security.

sources:
  - name: "CISA Advisories"
    type: "rss"
    url: "https://www.cisa.gov/uscert/ncas/all.xml"
    tags: ["cybersecurity", "cisa", "advisory"]

  - name: "NVD CVE Feed (recent)"
    type: "rss"
    url: "https://nvd.nist.gov/feeds/xml/cve/misc/nvd-rss.xml"
    tags: ["cybersecurity", "cve", "vulnerability"]

  - name: "FDA Medical Devices"
    type: "rss"
    url: "https://www.fda.gov/medical-devices/medical-device-recalls/rss.xml"
    tags: ["regulatory", "fda", "medtech"]

  - name: "WHO News"
    type: "rss"
    url: "https://www.who.int/rss-feeds/news-english.xml"
    tags: ["healthcare", "policy"]

  - name: "Nature Digital Health"
    type: "rss"
    url: "https://www.nature.com/subjects/medical-research.rss"
    tags: ["healthtech", "research"]

