name: local assistant
version: 1.0.0
schema: v1
models:
  # Chat + Agent Mode
  - name: Granite 4 Tiny
    provider: ollama
    model: granite4:tiny-h
    defaultCompletionOptions:
      contextLength: 131072
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  # Autocomplete
  - name: Granite 4 350m
    provider: ollama
    model: granite4:350m-h
    roles:
      - autocomplete

  # Embeddings (RAG)
  - name: Granite Embedding 30m
    provider: ollama
    model: granite-embedding:30m
    roles:
      - embed
    embedOptions:
      maxChunkSize: 512
